controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 100   # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController


diff_drive_controller:
  ros__parameters:
    use_sim_time: true

    # --- Joints (names must match wheel.xacro / car.ros2_control.xacro) ---
    left_wheel_names:  ["front_left_wheel_joint", "rear_left_wheel_joint"]
    right_wheel_names: ["front_right_wheel_joint", "rear_right_wheel_joint"]

    # --- Geometry (from car_properties.xacro) ---
    wheel_separation: 0.23          # 2 * wheel_y_offset = 2 * 0.115
    wheel_radius: 0.05
    wheel_separation_multiplier: 1.0   # skid-steer: raise (e.g. 1.2-1.5) if the car under-rotates
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    # --- Frames and odometry ---
    odom_frame_id: odom
    base_frame_id: base_footprint
    enable_odom_tf: true
    publish_rate: 50.0
    open_loop: false
    position_feedback: true
    pose_covariance_diagonal:  [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]

    # --- Safety: stop the wheels if commands stop arriving ---
    cmd_vel_timeout: 0.5            # seconds
    publish_limited_velocity: false
    velocity_rolling_window_size: 10

    # --- Speed limits (conservative for obstacle avoidance) ---
    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 0.5       # m/s
    linear.x.min_velocity: -0.2      # m/s (limited reverse)
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 0.6   # m/s^2
    linear.x.min_acceleration: -1.0  # m/s^2 (brakes harder than it accelerates)
    linear.x.has_jerk_limits: false

    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 1.5      # rad/s
    angular.z.min_velocity: -1.5
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 2.0  # rad/s^2
    angular.z.min_acceleration: -2.0
    angular.z.has_jerk_limits: false
